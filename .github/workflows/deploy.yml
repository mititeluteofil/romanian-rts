name: CI & Deploy to Cloudflare Workers

# Every PR and every push to a long-lived branch gets typecheck, tests, a build and a
# Worker dry run. Only milestone-1-scaffold (the Workers Builds production branch) deploys.
on:
  push:
    branches: [main, milestone-1-scaffold, milestone4]
  pull_request:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # `secrets` can't be used in a step's `if:`, so expose them as env vars and test those.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Bundles the Worker (relay + Durable Object + static assets) without uploading anything.
      - name: Check Worker bundle (dry run)
        run: npx wrangler@4 deploy --dry-run --outdir worker-dist

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/milestone-1-scaffold' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
